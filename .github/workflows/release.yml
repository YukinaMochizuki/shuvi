# Release: once CI has passed on a push to main, build the server's image (Dockerfile) and push it to the
# private registry as `<registry>/shuvi:main` and `<registry>/shuvi:sha-<first 12 of the commit>`. That push
# is the whole deployment step: the registry tells the configuration repository the tag moved, which pins the
# new digest, and the host deploys it. Nothing here knows about any of that.
#
# The registry is reachable only on the tailnet, so the job joins it first, as an ephemeral node tagged
# `tag:ci`, with an OAuth client. Reads are anonymous there; a push (any write method) needs a password, and
# `docker login` always succeeds (it only probes an anonymous GET), so the credentials are checked with a
# write request before the build, and a wrong one fails there, by name.
#
# `:main` only ever moves FORWARD. CI runs for two pushes can finish in either order, and this workflow's
# concurrency group serialises releases without ordering them, so a release for an older commit can run after
# a newer one's. The image is pushed as `:sha-<12>` first; `:main` is then pointed at it only if this commit is
# still the tip of main (`git ls-remote`, checked right before the retag). Otherwise `:main` is left to the
# newer commit's release, and this run says so: deploying older code onto a store a newer one may already have
# migrated is what this prevents.
#
# What the repository needs (the README's "Deploying" says how to make each):
#   variable  REGISTRY             the registry's host name, e.g. registry.<tailnet>.ts.net
#   secret    TS_OAUTH_CLIENT_ID   a Tailscale OAuth client with the `auth_keys` write scope and tag:ci
#   secret    TS_OAUTH_SECRET      its secret
#   secret    REGISTRY_USER        a user allowed to push to the registry
#   secret    REGISTRY_PASSWORD    its password
#
# The computer image has its own workflow (computer-image.yml); this one does not touch it.
# Actions are pinned by commit; the comment names the release.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: build and push the image
    # Only a CI run that passed, for a push to main of this repository (not a pull request from a fork whose
    # branch happens to be called main).
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check the configuration
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=()
          [ -n "$REGISTRY" ] || missing+=("variable REGISTRY (the registry's host name)")
          [ -n "$TS_OAUTH_CLIENT_ID" ] || missing+=("secret TS_OAUTH_CLIENT_ID (Tailscale OAuth client, auth_keys write, tag:ci)")
          [ -n "$TS_OAUTH_SECRET" ] || missing+=("secret TS_OAUTH_SECRET")
          [ -n "$REGISTRY_USER" ] || missing+=("secret REGISTRY_USER (a user that may push to the registry)")
          [ -n "$REGISTRY_PASSWORD" ] || missing+=("secret REGISTRY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error title=release not configured::missing $m"; done
            echo "Add them under Settings → Secrets and variables → Actions; see the README, \"Deploying\"."
            exit 1
          fi
          echo "tag=sha-${SHA:0:12}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # `docker login` cannot tell a wrong password (see the header), so ask for an upload, which is a write:
      # 202 means the credentials may push; the upload is cancelled at once.
      - name: Check the registry credentials can push
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          hdrs=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' --max-time 30 \
            -u "$REGISTRY_USER:$REGISTRY_PASSWORD" -X POST "https://$REGISTRY/v2/shuvi/blobs/uploads/") || {
            echo "::error title=registry unreachable::https://$REGISTRY/v2/ did not answer over the tailnet (is tag:ci allowed to reach the registry?)"
            exit 1
          }
          case "$code" in
            202) ;;
            401|403) echo "::error title=registry refused the push credentials::REGISTRY_USER / REGISTRY_PASSWORD may not push to $REGISTRY (HTTP $code)"; exit 1 ;;
            *) echo "::error title=registry check failed::POST /v2/shuvi/blobs/uploads/ answered HTTP $code"; exit 1 ;;
          esac
          location=$(grep -i '^location:' "$hdrs" | head -n1 | cut -d' ' -f2- | tr -d '\r')
          if [ -n "$location" ]; then
            case "$location" in http*) url="$location" ;; *) url="https://$REGISTRY$location" ;; esac
            curl -sS -o /dev/null --max-time 30 -u "$REGISTRY_USER:$REGISTRY_PASSWORD" -X DELETE "$url" || true
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder runs in a container of its own; on the host network it resolves tailnet names as the
          # job does.
          driver-opts: network=host

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ vars.REGISTRY }}/shuvi:${{ env.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            REVISION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `:main` follows the tip of main only (see the header): checked as late as possible, then a retag of the
      # image just pushed (no rebuild, no second push of its layers).
      - name: Point main at it, if this commit is still the tip of main
        id: main
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice title=main not moved::main is now at ${tip:0:12}, newer than ${SHA:0:12}; only shuvi:${tag} was pushed"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx imagetools create -t "$REGISTRY/shuvi:main" "$REGISTRY/shuvi:${tag}"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MOVED: ${{ steps.main.outputs.moved }}
        run: |
          {
            echo "### shuvi image"
            echo
            echo "Pushed \`shuvi:${tag}\` (commit \`${SHA:0:12}\`), digest \`${DIGEST}\`."
            if [ "$MOVED" = true ]; then
              echo "\`shuvi:main\` now points at it."
            else
              echo "\`shuvi:main\` was NOT moved: main has a newer commit, whose release moves it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

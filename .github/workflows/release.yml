# Release: once CI has passed on a push to main, build the server's image (Dockerfile) and push it to the
# GitHub Container Registry as `ghcr.io/<owner>/shuvi:sha-<first 12 of the commit>`, then `:main`.
#
# That push is all this does. Nothing on GitHub holds any credential of the platform the image runs on: the
# platform pulls the image itself, watching `:main` for a new digest. The package is public, like the code, so
# pulling needs no credential either; it must be made public once, after its first push (the README,
# "Deploying"). The only credential here is the workflow's own GITHUB_TOKEN, with `packages: write`, as
# computer-image.yml uses it.
#
# `:main` only ever moves FORWARD. CI runs for two pushes can finish in either order, and this workflow's
# concurrency group serialises releases without ordering them, so a release for an older commit can run after
# a newer one's. The image is pushed as `:sha-<12>` first; `:main` is then pointed at it only if this commit is
# still the tip of main (`git ls-remote`, checked right before the retag). Otherwise `:main` is left to the
# newer commit's release, and this run says so: deploying older code onto a store a newer one may already have
# migrated is what this prevents.
#
# The OCI labels (source, revision) link the package to this repository and name the commit it was built from.
# The computer image has its own workflow (computer-image.yml); this one does not touch it.
# Actions are pinned by commit; the comment names the release.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: build and push the image
    # Only a CI run that passed, for a push to main of this repository (not a pull request from a fork whose
    # branch happens to be called main).
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Image names must be lower case; an owner's name may not be.
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shuvi" >> "$GITHUB_ENV"
          echo "TAG=sha-${SHA:0:12}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          build-args: |
            REVISION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `:main` follows the tip of main only (see the header): checked as late as possible, then a retag of the
      # image just pushed (no rebuild, no second push of its layers).
      - name: Point main at it, if this commit is still the tip of main
        id: main
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice title=main not moved::main is now at ${tip:0:12}, newer than ${SHA:0:12}; only ${IMAGE}:${TAG} was pushed"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:$TAG"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MOVED: ${{ steps.main.outputs.moved }}
        run: |
          {
            echo "### shuvi image"
            echo
            echo "Pushed \`${IMAGE}:${TAG}\` (commit \`${SHA:0:12}\`), digest \`${DIGEST}\`."
            if [ "$MOVED" = true ]; then
              echo "\`${IMAGE}:main\` now points at it."
            else
              echo "\`${IMAGE}:main\` was NOT moved: main has a newer commit, whose release moves it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

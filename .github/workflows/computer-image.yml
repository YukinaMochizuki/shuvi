# Builds the computers' shared base image (computer/Dockerfile) and pushes it to the repository owner's
# PRIVATE package ghcr.io/<owner>/shuvi-computer, tagged with the commit sha. The digest it prints (also in
# the run's summary) is what SHUVI_COMPUTER_IMAGE names; see the README, "The computer's image".
name: computer image

on:
  push:
    paths:
      - "computer/**"
      - ".github/workflows/computer-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Image names must be lower case; an owner's name may not be.
      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shuvi-computer" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: computer
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}

      - name: Print the digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "SHUVI_COMPUTER_IMAGE=${IMAGE}@${DIGEST}"
          {
            echo "### shuvi-computer"
            echo
            echo "Pushed \`${IMAGE}:${GITHUB_SHA}\`. Point shuvi at it by digest:"
            echo
            echo "\`\`\`"
            echo "SHUVI_COMPUTER_IMAGE=${IMAGE}@${DIGEST}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
